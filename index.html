<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0B0616" />
<title>Hadeeqa Turns 7 ✦ Magical Birthday</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,900&family=Quicksand:wght@500;700&display=swap" rel="stylesheet" />
<style>
  /* ============================================================
     DESIGN TOKENS & PERFORMANCE OPTIMIZATIONS
     ============================================================ */
  :root {
    --ink: #1F1533;
    --paper: #FFFFFF;
    --gold-light: #F6DFA0;
    --gold: #E4B34A;
    --gold-deep: #C9932E;
    --accent-pink: #F3A79C;
    --accent-lilac: #E9DBFB;
    
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --shadow-soft: 0 10px 25px rgba(11, 6, 22, 0.15);
  }

  /* Hardware acceleration & smooth scrolling fixes */
  html { scroll-behavior: smooth; }
  body {
    margin: 0; padding: 0; min-height: 100vh;
    font-family: 'Quicksand', system-ui, sans-serif;
    color: var(--ink);
    background-color: #0B0616;
    background-image: 
      radial-gradient(circle at 15% 20%, rgba(139, 95, 191, 0.15), transparent 40%),
      radial-gradient(circle at 85% 80%, rgba(246, 223, 160, 0.1), transparent 40%);
    background-attachment: fixed; /* Prevents scroll repainting lag */
    overflow-x: hidden;
    overflow-y: hidden; /* Locked during intro */
  }

  h1, h2, h3 { font-family: 'Fraunces', serif; margin: 0; }
  p { line-height: 1.6; margin: 0 0 12px; }
  img, video { max-width: 100%; display: block; }

  /* ============================================================
     INTRO ANIMATION (ASTRONOMY -> 7 STARS -> ZOOM IN)
     ============================================================ */
  #intro {
    position: fixed; inset: 0; z-index: 9999;
    background: #030108;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
    transition: opacity 1s ease-in-out, visibility 1s ease-in-out;
  }

  /* Deep space galaxy element */
  .galaxy {
    position: absolute;
    width: 30vw; height: 30vw;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(139, 95, 191, 0.8), transparent 70%);
    filter: blur(30px);
    opacity: 0;
    transform: scale(0.5);
    animation: galaxyEmerge 4s ease-in-out forwards;
  }

  /* The 7 Stars Constellation */
  .constellation {
    position: relative;
    width: 200px; height: 280px;
    z-index: 2;
    opacity: 0;
    transform: scale(0.8);
    animation: starsAppear 4s ease-in-out forwards;
  }

  .star {
    position: absolute;
    width: 8px; height: 8px;
    background: #FFF;
    border-radius: 50%;
    box-shadow: 0 0 15px 4px rgba(246,223,160,0.8);
    animation: twinkle 1s infinite alternate;
  }

  /* Forming the number "7" */
  .star:nth-child(1) { top: 0%; left: 0%; animation-delay: 0.1s;}
  .star:nth-child(2) { top: 0%; left: 33%; animation-delay: 0.3s;}
  .star:nth-child(3) { top: 0%; left: 66%; animation-delay: 0.5s;}
  .star:nth-child(4) { top: 0%; left: 100%; animation-delay: 0.7s;}
  .star:nth-child(5) { top: 33%; left: 75%; animation-delay: 0.9s;}
  .star:nth-child(6) { top: 66%; left: 50%; animation-delay: 1.1s;}
  .star:nth-child(7) { top: 100%; left: 25%; animation-delay: 1.3s;}

  @keyframes galaxyEmerge {
    0% { opacity: 0; transform: scale(0.5) rotate(0deg); }
    40% { opacity: 0.6; transform: scale(1.5) rotate(45deg); }
    100% { opacity: 0; transform: scale(4) rotate(90deg); }
  }

  @keyframes starsAppear {
    0%, 20% { opacity: 0; transform: scale(0.8); }
    40%, 70% { opacity: 1; transform: scale(1); }
    100% { opacity: 0; transform: scale(15); } /* Massive zoom past the stars */
  }

  @keyframes twinkle {
    from { opacity: 0.6; transform: scale(0.8); }
    to { opacity: 1; transform: scale(1.2); }
  }

  /* ============================================================
     PINNED MUSIC BUTTON
     ============================================================ */
  .music-btn {
    position: fixed;
    bottom: calc(20px + var(--safe-bottom));
    right: 20px;
    z-index: 9000;
    width: 50px; height: 50px;
    border-radius: 50%;
    border: none;
    background: linear-gradient(135deg, var(--gold-light), var(--gold-deep));
    color: #1F1533;
    font-size: 1.5rem;
    box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.2s ease;
  }
  .music-btn:active { transform: scale(0.9); }

  /* ============================================================
     MAIN PAGE LAYOUT (Optimized)
     ============================================================ */
  #main {
    opacity: 0;
    visibility: hidden;
    transition: opacity 1s ease-in-out;
  }
  #main.show {
    opacity: 1;
    visibility: visible;
  }

  .container { max-width: 600px; margin: 0 auto; padding: 0 20px; }
  section { padding: 60px 0; }

  /* --- HERO SECTION --- */
  .hero {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 80px 20px 40px;
  }

  /* Bunting Banner Cards */
  .bunting-wrapper {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 6px;
    margin-bottom: 30px;
  }
  .bunting-card {
    background: linear-gradient(135deg, var(--accent-pink), #E8877A);
    color: white;
    font-family: 'Fraunces', serif;
    font-weight: 900;
    font-size: 1.2rem;
    width: 32px; height: 42px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 4px 4px 10px 10px;
    box-shadow: 0 4px 8px rgba(0,0,0,0.3);
    border-bottom: 2px solid rgba(255,255,255,0.3);
  }
  .bunting-wrapper .space { width: 15px; } /* Space between words */

  .hero-img {
    width: 100%;
    max-width: 320px;
    aspect-ratio: 3/4;
    object-fit: cover;
    border-radius: 20px;
    box-shadow: 0 15px 35px rgba(0,0,0,0.5);
    border: 3px solid var(--gold-light);
    margin-bottom: 25px;
  }

  .hero-name {
    font-family: 'Fraunces', serif;
    font-weight: 900;
    font-size: clamp(2.5rem, 10vw, 4rem);
    letter-spacing: 2px;
    background: linear-gradient(100deg, var(--gold-light) 0%, var(--gold) 50%, var(--gold-light) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: 0 4px 20px rgba(228,179,74,0.3);
  }

  /* --- 5 IMAGE CARDS SECTION --- */
  .cards-grid {
    display: flex;
    flex-direction: column;
    gap: 40px;
  }
  .photo-card {
    background: var(--paper);
    padding: 12px 12px 24px;
    border-radius: 8px;
    box-shadow: var(--shadow-soft);
    transform: rotate(-2deg);
    position: relative;
    /* Lightweight reveal transition instead of heavy scroll listener */
    opacity: 0;
    transform: translateY(30px) rotate(-2deg);
    transition: opacity 0.6s ease-out, transform 0.6s ease-out;
  }
  .photo-card.in-view {
    opacity: 1;
    transform: translateY(0) rotate(-2deg);
  }
  .photo-card:nth-child(even) { transform: translateY(30px) rotate(2deg); }
  .photo-card:nth-child(even).in-view { transform: translateY(0) rotate(2deg); }
  
  .photo-card img {
    width: 100%;
    aspect-ratio: 1/1;
    object-fit: cover;
    border-radius: 4px;
  }
  /* Tape effect */
  .photo-card::before {
    content: ""; position: absolute; top: -10px; left: 50%; transform: translateX(-50%) rotate(-3deg);
    width: 80px; height: 25px;
    background: rgba(255,255,255,0.5);
    border: 1px solid rgba(0,0,0,0.05);
    box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    z-index: 2;
  }

  /* --- 3 VIDEOS SECTION --- */
  .section-title {
    color: var(--gold-light);
    text-align: center;
    font-size: 2.2rem;
    margin-bottom: 30px;
  }
  .video-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 20px;
  }
  .video-slot {
    background: #1A1230;
    border-radius: 12px;
    padding: 10px;
    border: 1px solid rgba(246,223,160,0.2);
  }
  .video-slot video {
    width: 100%;
    border-radius: 8px;
    aspect-ratio: 16/9;
    background: #000;
  }

  /* --- CAKE SECTION --- */
  .cake-wrapper {
    text-align: center;
    background: rgba(255,255,255,0.03);
    padding: 40px 20px;
    border-radius: 30px;
  }
  .cake-svg {
    width: 100%;
    max-width: 300px;
    height: auto;
    margin: 0 auto;
  }

  /* --- MESSAGE SECTION --- */
  .message-box {
    background: var(--accent-lilac);
    color: var(--ink);
    padding: 40px 30px;
    border-radius: 20px;
    text-align: center;
    box-shadow: var(--shadow-soft);
  }
  .message-box h3 {
    font-size: 1.8rem;
    color: var(--jewel-deep);
    margin-bottom: 15px;
  }
  .message-box p {
    font-size: 1.1rem;
    font-weight: 700;
  }

  /* Minimal Footer */
  footer {
    text-align: center;
    padding: 40px 20px calc(80px + var(--safe-bottom));
    color: rgba(255,255,255,0.5);
    font-size: 0.9rem;
  }
</style>
</head>
<body>

<!-- Audio Element -->
<audio id="bgMusic" src="your-music-file.mp3" loop preload="auto"></audio>

<!-- Pinned Music Button -->
<button id="musicBtn" class="music-btn" aria-label="Toggle Music">🎵</button>

<!-- ==========================================

<div id="intro">

  <div class="constellation">
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>

    <div class="star"></div>

</div>

<!-- ==========================================
     MAIN CONTENT
     ========================================== -->
<div id="main">

<script>
  /* ============================================================
     1. INTRO ANIMATION & DIRECT ENTRY LOGIC
     ============================================================ */
  // Lock scrolling during intro
  document.body.style.overflowY = 'hidden';
  
  const intro = document.getElementById('intro');
  const main = document.getElementById('main');

  // The CSS animation takes exactly 4 seconds.
  // At 4.2 seconds, we hide the intro overlay and reveal the main page.
  setTimeout(() => {
    intro.style.opacity = '0';
    main.classList.add('show');
    document.body.style.overflowY = 'auto'; // Restore scrolling
    
    // Completely hide intro from DOM after transition
    setTimeout(() => {
      intro.style.display = 'none';
    }, 1000);
  }, 4200);

  /* ============================================================
     2. AUDIO PLAYBACK & MUTE TOGGLE
     ============================================================ */
  const bgMusic = document.getElementById('bgMusic');
  const musicBtn = document.getElementById('musicBtn');
  let isPlaying = false;

  // Function to attempt playback
  const attemptPlay = () => {
    bgMusic.play().then(() => {
      isPlaying = true;
      musicBtn.innerHTML = '🎵';
    }).catch((error) => {
      // Browsers block autoplay without user interaction.
      isPlaying = false;
      musicBtn.innerHTML = '🔇';
    });
  };

  // Try playing audio as soon as the main page is revealed
  setTimeout(attemptPlay, 4200);

  // If autoplay was blocked, play on the first touch/click anywhere on the screen
  document.body.addEventListener('click', () => {
    if (!isPlaying) {
      attemptPlay();
    }
  }, { once: true });

  // Pinned button toggle logic
  musicBtn.addEventListener('click', (e) => {
    e.stopPropagation(); // Prevents the body click event from firing simultaneously
    if (isPlaying) {
      bgMusic.pause();
      musicBtn.innerHTML = '🔇';
      isPlaying = false;
    } else {
      bgMusic.play();
      musicBtn.innerHTML = '🎵';
      isPlaying = true;
    }
  });

  /* ============================================================
     3. SMOOTH SCROLL REVEALS (Lightweight Performance)
     ============================================================ */
  // Use IntersectionObserver to fade in cards as you scroll down
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.classList.add('in-view');
        observer.unobserve(entry.target); // Only animate once
      }
    });
  }, { 
    threshold: 0.1,
    rootMargin: "0px 0px -50px 0px"
  });

  document.querySelectorAll('.fade-el').forEach(el => {
    observer.observe(el);
  });
</script>
